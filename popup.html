<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>TintCloud</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <h1>TintCloud</h1>

    <div id="sv"><div id="sv-thumb"></div></div>

    <div class="row">
      <div id="preview"></div>
      <div id="hue"><div id="hue-thumb"></div></div>
    </div>

    <div class="fields">
      <label>R<input type="number" id="r" min="0" max="255"></label>
      <label>G<input type="number" id="g" min="0" max="255"></label>
      <label>B<input type="number" id="b" min="0" max="255"></label>
      <label class="hex">Hex<input type="text" id="hex" maxlength="7" spellcheck="false"></label>
    </div>

    <button id="apply">Apply</button>

    <div class="links">
      <button id="report" class="link-btn report">Report an issue</button>
      <button id="github" class="link-btn github">View on GitHub</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
